backend:
  name: github
  repo: harry-brian-studio/harry-brian-studio
  branch: main
  base_url: https://harry-brian-studio-auth.soft-field-4204.workers.dev
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website"
    files:
      - name: "settings"
        label: "Website Settings"
        file: "content/settings.json"
        format: "json"
        fields:
          - { label: "Heading Font", name: "heading_font", widget: "string" }
          - { label: "Body Font", name: "body_font", widget: "string" }
          - { label: "Background Colour", name: "background_colour", widget: "color" }
          - { label: "Text Colour", name: "text_colour", widget: "color" }
          - { label: "Pink", name: "pink", widget: "color" }
          - { label: "Yellow", name: "yellow", widget: "color" }
          - { label: "Blue", name: "blue", widget: "color" }
          - { label: "Green", name: "green", widget: "color" }
          - { label: "Logo Image", name: "logo_image", widget: "image", required: false }
          - { label: "Logo Alt Text", name: "logo_alt", widget: "string", required: false }
          - { label: "Contact Email", name: "contact_email", widget: "string", default: "hello@harrybrianstudio.co.uk" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", default: "https://www.instagram.com/harrybrianstudio/" }

          - label: "Floating Graphics"
            name: "floating_graphics"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string", default: "Floating Graphic" }
              - { label: "Graphic Image", name: "image", widget: "image" }
              - { label: "Graphic Size", name: "size", widget: "number", default: 120, value_type: "int", min: 50, max: 300 }
              - { label: "Rotation", name: "rotation", widget: "number", default: 0, value_type: "int", min: -180, max: 180 }
              - { label: "Horizontal Position (%)", name: "position_x", widget: "number", default: 75, value_type: "int", min: 0, max: 100 }
              - { label: "Vertical Position (%)", name: "position_y", widget: "number", default: 20, value_type: "int", min: 0, max: 100 }

          - label: "Contact Section"
            name: "contact_section"
            widget: "object"
            fields:
              - { label: "Small Heading", name: "eyebrow", widget: "string", default: "GET IN TOUCH" }
              - { label: "Main Heading", name: "heading", widget: "string", default: "GOT AN IDEA?" }
              - { label: "Introduction", name: "intro", widget: "text", default: "Tell me what you're working on, what you've got in mind, or just say hello." }
              - { label: "Name Placeholder", name: "name_placeholder", widget: "string", default: "Your name" }
              - { label: "Email Placeholder", name: "email_placeholder", widget: "string", default: "Your email" }
              - { label: "Subject Placeholder", name: "subject_placeholder", widget: "string", default: "What are you enquiring about?" }
              - { label: "Message Placeholder", name: "message_placeholder", widget: "string", default: "Tell me a little about your project..." }
              - { label: "Send Button Text", name: "button_text", widget: "string", default: "SEND ENQUIRY →" }
              
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - { label: "Work Label", name: "work_label", widget: "string", default: "Work" }
              - { label: "Services Label", name: "services_label", widget: "string", default: "Services" }
              - { label: "About Label", name: "about_label", widget: "string", default: "About" }
              - { label: "Contact Label", name: "contact_label", widget: "string", default: "Contact" }
              
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Section Heading", name: "section_heading", widget: "string", default: "LET'S MAKE SOMETHING." }
              - { label: "Section Introduction", name: "section_intro", widget: "text", default: "From one-off personal artwork to bigger creative collaborations, there are a few ways we can work together." }
              
              - label: "Commissions"
                name: "commissions"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", default: "Commissions" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button Link", name: "button_link", widget: "string", required: false }

              - label: "Freelance"
                name: "freelance"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", default: "Freelance" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button Link", name: "button_link", widget: "string", required: false }

              - label: "Wholesale"
                name: "wholesale"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", default: "Wholesale" }
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Button Text", name: "button_text", widget: "string", required: false }
                  - { label: "Button Link", name: "button_link", widget: "string", required: false }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Studio Name", name: "studio_name", widget: "string", default: "HARRY BRIAN STUDIO" }
              - { label: "Footer Strapline", name: "strapline", widget: "string", default: "ILLUSTRATION · DESIGN · GOOD THINGS" }
              
      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.json"
        format: "json"
        fields:
          - { label: "Small Heading", name: "eyebrow", widget: "string" }
          - { label: "Main Heading", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Primary Button", name: "primary_button", widget: "string" }
          - { label: "Secondary Button", name: "secondary_button", widget: "string" }
          - { label: "Primary Button Link", name: "primary_button_link", widget: "string", default: "#contact" }
          - { label: "Secondary Button Link", name: "secondary_button_link", widget: "string", default: "#work" }
          - { label: "Hero Artwork", name: "hero_image", widget: "image", required: false }

      - name: "about"
        label: "About"
        file: "content/about.json"
        format: "json"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "About Text", name: "body", widget: "markdown" }
          - { label: "Small Heading", name: "eyebrow", widget: "string", default: "ABOUT THE STUDIO" }
          - { label: "Button Text", name: "button_text", widget: "string", default: "SAY HELLO →" }
          - { label: "Button Link", name: "button_link", widget: "string", default: "#contact" }

      - name: "portfolio"
        label: "Portfolio"
        file: "content/portfolio.json"
        format: "json"
        fields:
          - { label: "Section Heading", name: "section_heading", widget: "string", default: "SELECTED WORK." }
          - { label: "Section Introduction", name: "section_intro", widget: "text", default: "Your portfolio projects will appear here automatically when you add them in the website editor." }
          
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Project Title", name: "title", widget: "string" }

              - label: "Artwork Gallery"
                name: "images"
                widget: "list"
                required: false
                field:
                  label: "Artwork"
                  name: "image"
                  widget: "image"
                  
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
